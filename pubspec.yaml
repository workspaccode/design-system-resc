name: flutter_design_system
description: Professional Flutter design system generated by Figma Make
version: 1.1.0
homepage: https://github.com/workspaccode/design-system-resc

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  amicons: ^1.0.1
  cupertino_ui: ^1.1.6
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/svg/
    - assets/icons/
    - assets/image/
